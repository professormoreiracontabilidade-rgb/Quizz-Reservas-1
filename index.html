<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#073763"><title>Quiz 1 - Reservas - Professor Moreira</title><style>
:root{--navy:#073763;--blue:#0b5394;--sky:#d9efff;--gold:#f4b400;--green:#20a464;--red:#d93025;--ink:#172b3a}
*{box-sizing:border-box} body{margin:0;background:linear-gradient(145deg,#cfeafa,#f7fbff);font-family:Arial,Helvetica,sans-serif;color:var(--ink);min-height:100vh}
.app{max-width:760px;margin:auto;min-height:100vh;display:flex;flex-direction:column;padding:12px}.brand{background:var(--navy);color:white;border-radius:18px 18px 8px 8px;padding:14px 16px;text-align:center;box-shadow:0 6px 20px #07376333}.brand h1{font-size:clamp(19px,5vw,29px);margin:0}.brand p{margin:5px 0 0;color:#cdeaff;font-weight:700}.status{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;margin:10px 2px}.track{height:10px;background:#fff;border-radius:10px;overflow:hidden}.bar{height:100%;background:var(--gold);transition:.3s}.score,.counter{background:white;padding:7px 10px;border-radius:12px;font-weight:800;font-size:13px}.card{background:#fff;border:2px solid #b9d8ee;border-radius:18px;padding:clamp(16px,4vw,28px);box-shadow:0 8px 24px #07376322;flex:1;overflow:auto}.tag{display:inline-block;background:var(--blue);color:white;padding:6px 10px;border-radius:9px;font-size:12px;font-weight:bold}.source{font-size:13px;color:#4b6577;margin:10px 0;font-weight:bold}.stem{font-size:clamp(17px,4.2vw,22px);line-height:1.45;font-weight:700;margin:14px 0}.option{width:100%;display:flex;gap:10px;align-items:flex-start;text-align:left;border:2px solid #d7e4ed;background:#f8fcff;border-radius:13px;padding:13px;margin:9px 0;font-size:16px;line-height:1.35;cursor:pointer}.option b{display:grid;place-items:center;min-width:30px;height:30px;border-radius:50%;background:#d9efff;color:var(--navy)}.option.selected{border-color:var(--blue);background:#e8f4ff}.option.correct{border-color:var(--green);background:#ddf7e9}.option.wrong{border-color:var(--red);background:#fde4e1}.lights{display:flex;justify-content:center;gap:20px;margin:15px}.light{width:42px;height:42px;border-radius:50%;background:#bbb;border:5px solid #333;opacity:.25}.light.on.green{background:#31e981;opacity:1;box-shadow:0 0 24px #20d66b}.light.on.red{background:#ff4136;opacity:1;box-shadow:0 0 24px #ff4136}.feedback{text-align:center;font-weight:900;min-height:24px}.confirm{width:100%;border:0;border-radius:13px;background:var(--gold);color:#152638;font-weight:900;font-size:18px;padding:14px;cursor:pointer}.confirm:disabled{opacity:.45}.resolution h2{color:var(--navy);font-size:25px;margin-top:10px}.answer{background:#dff5e9;border-left:6px solid var(--green);padding:13px;border-radius:9px;font-size:18px;font-weight:900}.explain{font-size:18px;line-height:1.6}.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:10px}.controls button{border:0;border-radius:12px;padding:13px 6px;background:var(--navy);color:white;font-size:15px;font-weight:bold}.controls button:disabled{opacity:.35}.controls .restart{background:#647785}.finish{text-align:center;padding:25px}.finish .big{font-size:58px}.finish h2{color:var(--navy);font-size:30px}@media(max-width:480px){.app{padding:7px}.card{padding:15px}.option{font-size:15px;padding:11px}.controls button{font-size:13px}.source{font-size:12px}}
</style></head><body><main class="app"><header class="brand"><h1>CURSO DE CONTABILIDADE<br>PROFESSOR MOREIRA</h1><p>Patrimônio Líquido - Reservas • Quiz 1</p></header><section class="status"><div class="track"><div class="bar"></div></div><div class="score" id="score"></div><div class="counter" id="counter"></div></section><section class="card" id="card"></section><nav class="controls"><button id="prev" onclick="move(-1)">← VOLTAR</button><button class="restart" onclick="restart()">↻ REINICIAR</button><button id="next" onclick="move(1)">AVANÇAR →</button></nav></main><script>const QUESTIONS=[{"n": 1, "source": "FGV - AJ (TJ AP)/TJ AP/Apoio Especializado/Contador/2024", "stem": "Em uma empresa S/A, a diferença entre o valor dos ativos e o dos passivos representa o Patrimônio Líquido no Balanço Patrimonial, ou seja, pode-se dizer que é o valor contábil pertencente aos acionistas ou sócios. Nesse sentido, o Patrimônio Líquido (PL) é subdividido em diversas contas em que:", "options": ["a conta de Ajuste de Avaliação Patrimonial é considerada uma Reserva de Lucros;", "a reserva legal tem como finalidade garantir a integridade do capital social e é a única de constituição obrigatória;", "a conta \"ações em tesouraria\" representa as ações da empresa adquiridas por ela mesma e que aumentam o PL;", "a reserva de contingências tem como finalidade compensar, em exercício passado, a diminuição do lucro decorrente de perda julgada provável;", "a constituição da reserva de lucros a realizar é obrigatória naquele exercício em que o montante do dividendo obrigatório ultrapassar a parcela realizada do lucro líquido."], "answer": "b", "explanation": "A alternativa B está correta. A reserva legal é formada obrigatoriamente com 5% do lucro líquido, antes das demais destinações, respeitando o limite de 20% do capital social. Sua finalidade é proteger a integridade do capital social e ela só pode ser usada para compensar prejuízos ou aumentar o capital. O ajuste de avaliação patrimonial não é reserva de lucros; ações em tesouraria reduzem o PL; a reserva para contingências olha para perda futura; e a reserva de lucros a realizar é facultativa."}, {"n": 2, "source": "FGV - ANL (CM Fortal)/CM Fortaleza/Contador/2024", "stem": "De acordo com a Lei nº 6.404/76 e modificações, o saldo da soma de algumas reservas de lucros não poderá ultrapassar o capital social. Assinale a opção que indica apenas as reservas que são consideradas para o cálculo.", "options": ["Legal e estatutária.", "Legal e para contingências.", "Estatutária e de incentivos fiscais.", "Para contingências e de incentivos fiscais.", "De lucros a realizar e de lucros para expansão."], "answer": "a", "explanation": "A alternativa A está correta. Pelo art. 199, entram no limite geral as reservas de lucros, mas ficam excluídas as reservas para contingências, de incentivos fiscais e de lucros a realizar. Portanto, reserva legal e reserva estatutária são computadas. Atingido o capital social, o excesso deve ser destinado à integralização ou ao aumento do capital, ou à distribuição de dividendos."}, {"n": 3, "source": "FGV - AFFC (STN)/STN/Contábil/2024", "stem": "O estatuto de uma sociedade empresária previa, anualmente, a constituição de uma reserva com o intuito de segregar uma parcela dos lucros, correspondente a prováveis perdas extraordinárias futuras. Ao final de cada exercício, a sociedade empresária deveria constituir reserva", "options": ["legal.", "estatutária.", "para retenção.", "para contingências.", "de lucros a realizar."], "answer": "d", "explanation": "A alternativa D está correta. A reserva para contingências separa parte do lucro para compensar, em exercício futuro, a redução do lucro causada por perda provável e estimável. O fato de a previsão constar do estatuto não muda a essência da finalidade descrita. Reserva estatutária exige finalidade, critério anual e limite máximo definidos, mas a perda extraordinária futura caracteriza especificamente contingência."}, {"n": 4, "source": "FGV - AFFC (STN)/STN/Contábil/2024", "stem": "De acordo com a Lei nº 6.404/1976 e modificações, o saldo das reservas de lucros, exceto as para contingências, de incentivos fiscais e de lucros a realizar, não poderá ultrapassar o capital social. Atingindo esse limite, a assembleia deverá deliberar sobre a aplicação do excesso. A aplicação poderá ser feita", "options": ["na liquidação de passivos ou na compra de ativos.", "no aumento do capital social ou na compra de ações em tesouraria.", "na constituição de reservas de lucros para expansão ou na compra de ações em tesouraria.", "na constituição de reservas de lucros para expansão ou na distribuição de dividendos.", "no aumento do capital social ou na distribuição de dividendos."], "answer": "e", "explanation": "A alternativa E está correta. Quando as reservas alcançam o limite do capital social, a assembleia delibera sobre o excesso. A Lei permite aplicá-lo na integralização do capital já subscrito, no aumento do capital social ou na distribuição de dividendos. Compra de ativos, liquidação de passivos e formação de nova reserva não são as destinações indicadas pelo art. 199."}, {"n": 5, "source": "FGV - Per (PC AM)/PC AM/4ª Classe/Contabilidade/2022", "stem": "Assinale a opção que indica a contabilização da contrapartida do lançamento da reversão da reserva de lucros a realizar constituída em anos anteriores, quando os lucros nela contidos forem realizados financeiramente.", "options": ["Dividendos a pagar.", "Lucros acumulados.", "Reserva de lucros.", "Ações em Tesouraria", "Reserva de Ágio."], "answer": "b", "explanation": "A alternativa B está correta. Quando o lucro antes não realizado se realiza financeiramente, a reserva de lucros a realizar é revertida para lucros acumulados. O lançamento transfere o valor dentro do próprio patrimônio líquido: débito na reserva de lucros a realizar e crédito em lucros acumulados, permitindo sua posterior destinação, especialmente ao dividendo obrigatório."}, {"n": 6, "source": "FGV - TAFE (Sefaz AM)/SEFAZ AM/2022", "stem": "Assinale a opção que indica a reserva constituída no patrimônio líquido de uma sociedade empresária com o objetivo de segregar uma parcela de lucros, correspondente a prováveis perdas extraordinárias futuras, que deverão diminuir o resultado em exercícios futuros.", "options": ["Legal.", "Estatutárias.", "Para contingências.", "De lucros a realizar.", "De lucros para expansão."], "answer": "c", "explanation": "A alternativa C está correta. A descrição traz os elementos típicos da reserva para contingências: parcela de lucros, perda extraordinária futura, perda provável e impacto esperado nos resultados de exercícios seguintes. Ela não reconhece uma obrigação presente; apenas retém lucro para suavizar o efeito futuro sobre os dividendos."}, {"n": 7, "source": "FGV - AJ TRT13/TRT 13/Administrativa/Contabilidade/2022", "stem": "No exercício de X0, uma sociedade empresária constituiu reserva para contingências, no valor de R$20.000, pois previa uma perda extraordinária futura. Assinale o efeito que pode ocorrer em decorrência da constituição desta reserva.", "options": ["Antecipação de possíveis prejuízos.", "Obediência ao regime de competência.", "Economia de imposto de renda a pagar.", "Reconhecimento de perdas possíveis realizadas.", "Uniformização dos dividendos anuais distribuídos."], "answer": "e", "explanation": "A alternativa E está correta. A reserva para contingências pode uniformizar os dividendos ao longo dos exercícios. No ano lucrativo, parte do lucro é retida; quando a perda prevista ocorrer ou deixar de ser provável, a reserva é revertida. Não há antecipação contábil da perda, redução do imposto ou reconhecimento de despesa: trata-se de destinação do lucro líquido."}, {"n": 8, "source": "FGV - AJ TRT13/TRT 13/Administrativa/Contabilidade/2022", "stem": "O saldo das reservas de lucros da Exportadora Itapemirim do Castelo S/A ultrapassou em 15% (quinze por cento) o valor do capital social. Diante da ocorrência e considerando que não há, nessa companhia, constituição de reservas para contingências, de lucros a realizar ou de incentivos fiscais, assinale a afirmativa correta.", "options": ["O Conselho de Administração deliberará sobre a aplicação do excesso na integralização do capital social ou na constituição de reserva de capital ou no resgate de ações.", "O Conselho Fiscal, se permanente, deliberará sobre a aplicação do excesso na constituição de reserva legal ou no aumento do capital social ou na outorga de opções de compra de ações.", "A Diretoria deliberará sobre a aplicação do excesso na integralização do capital social ou na amortização de ações ou no resgate de bônus de subscrição.", "O acionista controlador encaminhará proposta ao Conselho de Administração sobre a aplicação do excesso no resgate de debêntures ou no aumento do capital social ou na distribuição de dividendos.", "A Assembleia Geral deliberará sobre a aplicação do excesso na integralização ou no aumento do capital social ou na distribuição de dividendos."], "answer": "e", "explanation": "A alternativa E está correta. Sem reservas excluídas do limite, o saldo excedente deve ser tratado pela Assembleia Geral. As destinações legais são integralização ou aumento do capital social e distribuição de dividendos. Conselho de Administração, Conselho Fiscal, Diretoria ou acionista controlador não substituem a competência atribuída à assembleia nesse caso."}, {"n": 9, "source": "FGV - Ana EF (BANESTES)/BANESTES/Gestão Contábil/2018", "stem": "Uma entidade pode aumentar o seu capital social por meio da captação de novos sócios ou do aumento da participação desses, mas também por incorporação de valores já reconhecidos no Patrimônio Líquido. O item patrimonial que pode ter valores alocados para aumento do capital social é:", "options": ["ações em tesouraria;", "ajustes acumulados de conversão;", "ajustes de avaliação patrimonial;", "reservas de lucros;", "resultado de operações com acionistas não controladores."], "answer": "d", "explanation": "A alternativa D está correta. Reservas de lucros são parcelas de resultados já reconhecidos e retidos no patrimônio líquido. A Lei admite sua incorporação ao capital social. Ações em tesouraria são conta redutora; ajustes de conversão, ajustes de avaliação patrimonial e efeitos com não controladores têm natureza própria e não correspondem à destinação indicada na questão."}, {"n": 10, "source": "FGV - Aud (MPE AL)/MPE AL/2018", "stem": "Assinale a opção que indica o objetivo da constituição da reserva de contingências.", "options": ["Equalizar a distribuição de dividendos quando se prevê diminuição no lucro líquido ou prejuízo, decorrentes de fatos extraordinários futuros.", "Equalizar a distribuição de dividendos quando se prevê diminuição no lucro líquido ou prejuízo, decorrentes de perdas de causas na justiça.", "Garantir o financiamento da expansão da entidade, que irá trazer lucros futuros.", "Evitar que a empresa apure prejuízo em um período contábil específico.", "Equalizar a distribuição de dividendos quando há existência de ativos contingentes não reconhecidos."], "answer": "a", "explanation": "A alternativa A está correta. A reserva para contingências procura manter maior regularidade na distribuição de dividendos quando se prevê queda de lucro ou prejuízo por fato extraordinário futuro. Ela não serve para expansão nem para impedir contabilmente um prejuízo. Perdas em processos judiciais com obrigação presente são tratadas, conforme a probabilidade, pela disciplina de provisões e passivos contingentes."}, {"n": 11, "source": "FGV - Aud (MPE AL)/MPE AL/2018", "stem": "Assinale a opção que indica, no patrimônio líquido de uma sociedade empresária, o item que faz parte da reserva de lucro.", "options": ["O ágio na emissão de ações.", "A reserva especial de ágio na incorporação.", "A reserva de incentivos fiscais.", "A alienação de bônus de subscrição.", "A alienação de partes beneficiárias."], "answer": "c", "explanation": "A alternativa C está correta. A reserva de incentivos fiscais é uma reserva de lucros, constituída com parcela do lucro decorrente de doações ou subvenções governamentais para investimentos. Ágio na emissão de ações, alienação de bônus de subscrição e alienação de partes beneficiárias são exemplos ligados a reservas de capital."}, {"n": 12, "source": "FGV - Ass Leg (ALERO)/ALERO/Técnico em Contabilidade/2018", "stem": "A Cia. M é controlada pela Cia. P. A Cia. P avalia seu investimento na Cia. M pelo método de equivalência patrimonial. Este é o seu único ativo. Em 31/12/2017, a Cia. P reconheceu receita de equivalência patrimonial no valor de R$100.000. No momento da destinação do lucro, a empresa analisou a justificativa para realizar a retenção integral do valor. Assinale a opção que indica a reserva que deveria ser constituída, de acordo com a legislação societária.", "options": ["Reserva de contingência.", "Reserva estatutária.", "Reserva de lucros a realizar.", "Reserva de equivalência patrimonial.", "Reserva de capital."], "answer": "c", "explanation": "A alternativa C está correta. O resultado positivo de equivalência patrimonial é lucro contábil sem realização financeira imediata. Se o dividendo obrigatório superar a parcela realizada do lucro, a companhia poderá constituir reserva de lucros a realizar pelo excesso. A lei não prevê uma 'reserva de equivalência patrimonial' autônoma."}];
const data=QUESTIONS; let slide=0, picked={}, checked={}, points=0;
const $=s=>document.querySelector(s), letters=['a','b','c','d','e'];
function render(){const total=data.length*2; $('#counter').textContent=`Tela ${Math.min(slide+1,total)} de ${total}`; $('.bar').style.width=`${Math.min((slide+1)/total*100,100)}%`; $('#score').textContent=`Acertos: ${points}`; $('#prev').disabled=slide===0; $('#next').disabled=slide>=total-1; const q=data[Math.floor(slide/2)]; if(slide%2===0){let opts=q.options.map((o,i)=>{let c='option';if(picked[q.n]===letters[i])c+=' selected';if(checked[q.n]){if(letters[i]===q.answer)c+=' correct';else if(picked[q.n]===letters[i])c+=' wrong'}return `<button class="${c}" onclick="choose('${letters[i]}')" ${checked[q.n]?'disabled':''}><b>${letters[i].toUpperCase()}</b><span>${o}</span></button>`}).join('');let ok=checked[q.n]&&picked[q.n]===q.answer;$('#card').innerHTML=`<span class="tag">QUESTÃO ${q.n}</span><div class="source">${q.source}</div><div class="stem">${q.stem}</div>${opts}<div class="lights"><div class="light green ${checked[q.n]&&ok?'on':''}"></div><div class="light red ${checked[q.n]&&!ok?'on':''}"></div></div><div class="feedback">${checked[q.n]?(ok?'✅ RESPOSTA CORRETA!':'❌ RESPOSTA ERRADA'):'Selecione uma alternativa'}</div><button class="confirm" onclick="confirmAnswer()" ${!picked[q.n]||checked[q.n]?'disabled':''}>CONFIRMAR RESPOSTA</button>`}else{$('#card').innerHTML=`<div class="resolution"><span class="tag">RESOLUÇÃO • QUESTÃO ${q.n}</span><h2>Explicação detalhada</h2><div class="answer">Gabarito: ${q.answer.toUpperCase()}</div><p class="explain">${q.explanation}</p><p class="explain"><b>Como a FGV pensa:</b> identifique a origem do valor (lucro ou transação de capital), a finalidade da reserva e as limitações impostas pela Lei nº 6.404/1976.</p></div>`} window.scrollTo(0,0)}
function choose(l){picked[data[Math.floor(slide/2)].n]=l;render()} function confirmAnswer(){let q=data[Math.floor(slide/2)];if(!picked[q.n]||checked[q.n])return;checked[q.n]=true;if(picked[q.n]===q.answer)points++;render()} function move(d){let n=slide+d;if(n>=0&&n<data.length*2){slide=n;render()}} function restart(){if(confirm('Deseja reiniciar o quiz e apagar todas as respostas?')){slide=0;picked={};checked={};points=0;render()}} render();
</script></body></html>
